[workspace]
resolver = "3"
members = ["crates/mee-core", "crates/mee-engine", "programs/mee"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive", "min_const_generics", "extern_crate_alloc"] }
borsh = { version = "1.5", features = ["derive"] }
rustc-hash = "2"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
sha2 = "0.10"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
