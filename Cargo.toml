[workspace]
resolver = "3"
members = ["crates/mee-core", "programs/mee"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive", "min_const_generics", "extern_crate_alloc"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
