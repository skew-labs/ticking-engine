[package]
name = "mee-net"
description = "MEE validator networking: authenticated P2P transport, gossip, sync, HTTP/WebSocket API"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mee-validator"
path = "src/main.rs"

[[bin]]
name = "mee-relayer"
path = "src/bin/relayer.rs"

[dependencies]
mee-chain = { path = "../mee-chain" }
mee-consensus = { path = "../mee-consensus" }
mee-core = { path = "../mee-core" }
mee-engine = { path = "../mee-engine" }
mee-node = { path = "../mee-node" }
mee = { path = "../../programs/mee", features = ["no-entrypoint"] }
base64 = "0.22"
bs58 = "0.5"
bytemuck.workspace = true
chacha20poly1305 = "0.10"
x25519-dalek = "2"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4.1", features = ["wincode"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws"] }
borsh.workspace = true
ed25519-dalek.workspace = true
hex = "0.4"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }

[dev-dependencies]
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-account = "4"
tokio-tungstenite = "0.26"
futures-util = "0.3"
